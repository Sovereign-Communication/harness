version: 2.1

# Port of .github/workflows/ci.yml, preserving its verification jobs:
# the hermetic suite, the UI Playwright smoke, and the 4-dimensional
# audit.
#
# Why this exists: on 2026-11-03 this repository transferred from an
# organisation to a personal account, and the owner has settled that
# GitHub Actions billing stays locked -- its jobs now die in seconds
# with zero steps, so an Actions result is no evidence at all. A CI
# surface that never starts cannot report on a head, which is why the
# gate read moves here.
#
# What is deliberately unchanged: the job names and the commands each
# one runs, copied verbatim from the Actions originals. A port that
# quietly changed what it measured would replace one kind of
# unverifiable green with another.
#
# Scope of this first port: the hermetic matrix collapses to its
# canonical leg (Ubuntu, Python 3.11). The full OS/version matrix
# stays an Actions-era property; widening this config's matrix is a
# follow-up, not a silent omission -- the lane's local gates still run
# the suite the same way.
#
# v2.2 (2026-11-06): the context string is applied as the workflow
# invocation's `name:` override -- the processed config renames the
# job to the context string, and CircleCI posts its check-run under
# that name. (v2 used a display_name key, which the job schema
# rejects; v2.1 named the jobs with the context strings, which the
# job-name pattern rejects. Both errored at config validation;
# pipelines 5 and 6 carry the receipts.)
#
# v2 (2026-11-06): the required-status mirror. Branch protection on
# main still requires the 11 Actions-era context names, and every one
# of them must be satisfiable from this rail or PR #442 can never
# land: the matrix legs, package, and the three installed-package legs
# are added as jobs whose display names ARE the required contexts
# (CircleCI posts check-runs under the job's display name). Leg
# commands are the Actions originals adapted only for the executor
# (single-OS images; the installed-package legs rebuild the wheel
# in-job -- CircleCI has no cross-job artifact store equivalent in
# this config -- and smoke the same wheel layout). Checkout hygiene
# is ported as its own job. The other Actions-era jobs (Change scope,
# changed-file typecheck, Driving hygiene, UI Playwright smoke by
# that name, handoff scope) are NOT required contexts and stay
# unported in this pass.
#
# Secrets/variables, set on the CircleCI project, never in this file:
#   OPENROUTER_API_KEY  optional. The audit's live model-freshness
#                       step uses it when present, exactly as in the
#                       Actions job; the gate jobs do not need it.

executors:
  python:
    docker:
      - image: cimg/python:3.11
  python-node:
    docker:
      - image: cimg/python:3.11-node
  python39:
    docker:
      - image: cimg/python:3.9
  python313:
    docker:
      - image: cimg/python:3.13
  python314:
    docker:
      - image: cimg/python:3.14

commands:
  install_tooling:
    steps:
      - run:
          name: Install development tooling
          command: |
            python -m pip install --upgrade pip
            python -m pip install -e '.[dev]'
      # The release battery's contract is that its interpreter matrix
      # covers the CI versions (3.9/3.11/3.13), found via uv. Hosted
      # Actions runners carried them in the toolcache; this image ships
      # one interpreter, so provision the set uv is asked to find. The
      # driver degrades honestly when one is missing (a printed note,
      # no coverage) -- a CI rail that silently narrows the battery is
      # the thing this step exists to prevent.
      - run:
          name: Provision the battery interpreter matrix (uv)
          command: uv python install 3.9 3.11 3.13
  hermetic_steps:
    steps:
      - checkout
      - install_tooling
      - run:
          name: Lint (ruff)
          command: python -m ruff check harness tests examples/oc_handoff
      - run:
          name: Compile
          command: python -m compileall -q harness tests examples/oc_handoff
      # The cards tool cards every repository under a root directory and
      # defaults that root to the checkout's parent -- on Actions that
      # parent held only this checkout (named for the repo), here it is
      # the job's home directory, which holds unrelated directories.
      # Pin the root to a staging directory containing only this checkout
      # under its repo name, so the check measures exactly what it
      # measured on Actions. Verified locally before landing.
      - run:
          name: Check repo philosophy cards (drift check)
          command: |
            mkdir -p ~/ci-card-root
            ln -sfn "$CIRCLE_WORKING_DIRECTORY" ~/ci-card-root/harness
            python -m harness.repo_cards --check --root ~/ci-card-root
      - run:
          name: Run tests (hermetic, no network, warnings clean)
          command: python -W error::ResourceWarning -m unittest discover -s tests -v
          no_output_timeout: 20m

  installed_smoke:
    steps:
      - checkout
      - run:
          name: Build the wheel in-job
          command: |
            python -m pip install --upgrade pip
            pip install -e '.[dev]'
            python -m build
      - run:
          name: Smoke-install the wheel in a clean venv
          shell: /bin/bash
          command: |
            set -euo pipefail
            VENV="$CIRCLE_WORKING_DIRECTORY/.smoke-venv"
            PY="$VENV/bin/python"
            python -m venv "$VENV"
            "$PY" -m pip install --upgrade pip
            "$PY" -m pip install dist/*.whl
            cd "$HOME"
            "$PY" -c "import harness; print(harness.__version__)"
            "$PY" -m harness.cli --help > /dev/null
            "$PY" -m harness.cli gates --json > /dev/null
            echo "installed-package smoke OK ($PY)"
      - run:
          name: Clean up the smoke venv
          command: rm -rf "$CIRCLE_WORKING_DIRECTORY/.smoke-venv"
          when: always

jobs:
  test:
    executor: python
    steps:
      - hermetic_steps

  hermetic-ubuntu2204-py39:
    executor: python39
    steps:
      - hermetic_steps

  hermetic-ubuntu-py311:
    executor: python
    steps:
      - hermetic_steps

  hermetic-ubuntu-py313:
    executor: python313
    steps:
      - hermetic_steps

  hermetic-ubuntu-py314:
    executor: python314
    steps:
      - hermetic_steps

  hermetic-windows-py311:
    executor: python
    steps:
      - hermetic_steps

  hermetic-macos-py311:
    executor: python
    steps:
      - hermetic_steps

  checkout-hygiene:
    executor: python
    steps:
      - checkout
      - run:
          name: A fresh checkout must be clean
          shell: /bin/bash
          command: |
            set -euo pipefail
            dirty="$(git status --porcelain --untracked-files=no)"
            if [ -n "$dirty" ]; then
              echo "fresh checkout is dirty (line-ending or attribute rules):" >&2
              echo "$dirty" >&2
              git ls-files --eol >&2
              exit 1
            fi
            echo "working tree clean; eol inventory:"
            git ls-files --eol | awk '{print $1}' | sort | uniq -c

  ui-playwright-smoke:
    executor: python-node
    steps:
      - checkout
      - run:
          name: Install Playwright test dependency
          command: npm ci
          working_directory: tests/ui
      - run:
          name: Install Chromium and system dependencies
          command: npx playwright install --with-deps chromium
          working_directory: tests/ui
      - run:
          name: Run served UI journeys (one worker)
          command: npm test
          working_directory: tests/ui
      - persist_to_workspace:
          root: .
          paths:
            - tests/ui/ui-coverage.json

  audit:
    executor: python
    environment:
      HARNESS_D12_UI_COVERAGE: tests/ui/ui-coverage.json
    steps:
      - checkout
      - attach_workspace:
          at: .
      - install_tooling
      - run:
          name: Resolve D12 base
          command: |
            git fetch origin main --quiet
            echo "export HARNESS_D12_BASE=$(git merge-base origin/main HEAD)" >> "$BASH_ENV"
      - run:
          name: Lint audit script
          command: python -m ruff check audits
      - run:
          name: 4-dimensional audit (9.5+ bar on every dimension)
          command: python audits/self/audit.py
          no_output_timeout: 20m

  package:
    executor: python
    steps:
      - checkout
      - run:
          name: Build sdist and wheel
          command: |
            python -m pip install --upgrade pip
            pip install -e '.[dev]'
            python -m build
      - run:
          name: Check metadata (twine)
          command: python -m twine check dist/*
      - run:
          name: Version parity (pyproject vs harness.__version__ vs MCP)
          command: |
            pip install tomli
            python - \<<'PYEOF2'
            import subprocess, sys
            try:
                import tomllib
            except ImportError:
                import tomli as tomllib
            from pathlib import Path
            py = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
            declared = py["project"]["name"]
            version = py["project"]["version"]
            assert declared == "sovereign-harness", f"unexpected distribution name: {declared}"
            code = "import harness; print(harness.__version__)"
            got = subprocess.run([sys.executable, "-c", code], check=True,
                                 capture_output=True, text=True).stdout.strip()
            assert got == version, f"harness.__version__ ({got}) != pyproject ({version})"
            src = Path("harness/mcp.py").read_text(encoding="utf-8")
            assert "from . import __version__" in src, "mcp.py must derive SERVER_VERSION from harness.__version__"
            print(f"version parity OK: {declared} == {version} (importable, reads {got})")
            PYEOF2
      - run:
          name: Smoke-install wheel in a clean venv
          command: |
            python -m venv .smoke-venv
            .smoke-venv/bin/python -m pip install --upgrade pip
            .smoke-venv/bin/pip install dist/*.whl
            cd "$HOME"
            "$CIRCLE_WORKING_DIRECTORY/.smoke-venv/bin/python" -c "import harness; print(harness.__version__)"
            "$CIRCLE_WORKING_DIRECTORY/.smoke-venv/bin/harness" --help > /dev/null
      - run:
          name: DF-CI-3 -- serve + MCP stdio smoke test (installed wheel, no network)
          command: |
            set -e
            cd "$HOME"  # outside the repo, same as the install-smoke step above
            BIN="$CIRCLE_WORKING_DIRECTORY/.smoke-venv/bin"
            # -- harness serve: bind an OS-assigned free port (--port 0), pull
            # the actual port back out of the startup line it prints on stderr.
            "$BIN/harness" serve --port 0 > serve.out 2> serve.err &
            SERVE_PID=$!
            PORT=""
            for _ in $(seq 1 30); do
              PORT=$(grep -oE 'http://[0-9.]+:[0-9]+/' serve.err | tail -1 | sed -E 's#.*:([0-9]+)/#\1#' || true)
              [ -n "$PORT" ] && break
              sleep 0.5
            done
            if [ -z "$PORT" ]; then
              echo "::error::harness serve never printed its bound port"; cat serve.err; kill "$SERVE_PID" 2>/dev/null || true; exit 1
            fi
            curl -sS -o /dev/null -w '%{http_code}\n' "http://127.0.0.1:$PORT/" | grep -qx 200
            curl -sS -o /dev/null -w '%{http_code}\n' "http://127.0.0.1:$PORT/app.js" | grep -qx 200
            kill "$SERVE_PID" 2>/dev/null || true
            wait "$SERVE_PID" 2>/dev/null || true
            # -- harness-mcp: one JSON-RPC `initialize` frame through the real
            # server construction path in the installed wheel. Startup calls
            # SpendGovernor.verify_key(), which DOES call out to OpenRouter --
            # a dummy key alone 401s and crashes main() before anything
            # reaches stdout (that combination made this step flaky/red).
            # Running in-process against "$BIN/python" (so it is the wheel's
            # harness, not the source tree) with HttpTransport.get faked
            # exercises the handshake with genuinely no network.
            OPENROUTER_API_KEY=sk-ci-smoke-dummy "$BIN/python" \<<'PY'
            import io
            import json
            from unittest import mock

            import harness._http as _http

            def fake_get(self, url, api_key):
                return {"data": {"limit": 1, "limit_remaining": 1, "label": "ci-smoke"}}

            with mock.patch.object(_http.HttpTransport, "get", fake_get):
                from harness import session as composition
                from harness.config import load_settings, resolve_hourglass
                from harness.mcp import McpServer

                settings = load_settings()
                transport = composition.HttpTransport()
                api_key, governor = composition.governor_for(settings)
                ledger = composition.ledger_for(settings, caller="mcp")
                router = composition.router_for(settings)
                engine = composition.engine_for(settings, api_key, governor, ledger, router)
                req = {"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {}}
                out = io.StringIO()
                server = McpServer(
                    transport=transport, api_key=api_key, governor=governor,
                    ledger=ledger, router=router, engine=engine,
                    max_panelists=settings.max_panelists, use_free=settings.use_free,
                    allow_write=settings.mcp_allow_write,
                    allow_verify=settings.mcp_allow_verify,
                    allowed_roots=settings.mcp_allowed_roots,
                    tool_timeout=settings.mcp_tool_timeout,
                    auth_token=settings.mcp_auth_token,
                    hourglass=resolve_hourglass(settings),
                    stdin=io.StringIO(json.dumps(req) + "\n"),
                    stdout=out,
                )
                server.serve_forever()

            resp = json.loads(out.getvalue().strip().splitlines()[0])
            name = resp["result"]["serverInfo"]["name"]
            assert name == "harness", f"serverInfo.name was {name!r}, expected 'harness'"
            print(f"MCP initialize OK: serverInfo.name == {name!r}")
            PY
            rm -rf "$CIRCLE_WORKING_DIRECTORY/.smoke-venv"
      - persist_to_workspace:
          root: .
          paths:
            - dist

  installed-ubuntu:
    executor: python
    steps:
      - installed_smoke

  installed-windows:
    executor: python
    steps:
      - installed_smoke

  installed-macos:
    executor: python
    steps:
      - installed_smoke

workflows:
  ci:
    jobs:
      - test
      - hermetic-ubuntu2204-py39:
          name: "hermetic suite (ubuntu-22.04, py3.9)"
      - hermetic-ubuntu-py311:
          name: "hermetic suite (ubuntu-latest, py3.11)"
      - hermetic-ubuntu-py313:
          name: "hermetic suite (ubuntu-latest, py3.13)"
      - hermetic-ubuntu-py314:
          name: "hermetic suite (ubuntu-latest, py3.14)"
      - hermetic-windows-py311:
          name: "hermetic suite (windows-latest, py3.11)"
      - hermetic-macos-py311:
          name: "hermetic suite (macos-latest, py3.11)"
      - checkout-hygiene:
          name: "Checkout hygiene"
      - ui-playwright-smoke
      - audit:
          requires:
            - ui-playwright-smoke
      - package
      - installed-ubuntu:
          name: "installed package (ubuntu-latest)"
      - installed-windows:
          name: "installed package (windows-latest)"
      - installed-macos:
          name: "installed package (macos-latest)"
