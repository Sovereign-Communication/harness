[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-harness"
version = "0.4.1"
description = "Cost-bounded multi-model verification & coding harness with AI sovereignty — consent, continued consensus, and a verifiable participation ledger. Pure Python stdlib, zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["openrouter", "mcp", "llm", "verification", "agent", "sovereignty", "autonomy", "consent"]

[project.urls]
Homepage = "https://github.com/Sovereign-Communication/harness"
Issues = "https://github.com/Sovereign-Communication/harness/issues"

[project.scripts]
harness = "harness.cli:main"
harness-mcp = "harness.mcp:main"
harness-desktop = "harness.ui:main"

[tool.setuptools.packages.find]
include = ["harness*"]

# The web/desktop UI ships inside the package: `harness serve` / `harness
# desktop` read these files at runtime (harness/ui/), so an installed wheel
# must carry them or every static page 500s.
[tool.setuptools.package-data]
harness = ["ui/*.html", "ui/*.js", "ui/*.css"]
[project.optional-dependencies]
dev = ["ruff>=0.6", "build>=1.2", "twine>=5"]
local-fit-train = ["numpy", "onnx", "onnxruntime"]
desktop = ["pywebview>=5"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B007", "B017", "B904", "UP015", "UP031"]
ignore = ["E501"]
