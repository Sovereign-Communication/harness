name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer run for the same ref supersedes queued/running ones -- stops the
# queued-runs pileup seen on the runner-availability crunch of 2026-09-19.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  handoff-scope:
    name: Handoff ownership scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate changed handoffs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -z "$base" ]; then
            echo "handoff-scope: no comparison commit; refusing to skip the gate" >&2
            exit 2
          fi
          python scripts/validate_handoff_scope.py --repo-root . --changed-from "$base"

  # PLAT-ci-matrix: the hermetic suite runs on every supported OS, and the
  # parity tests inside it are what make "same bytes everywhere" a claim
  # rather than an intention. The full python-version sweep stays on Ubuntu
  # (the oldest supported version is the interesting one and needs a
  # Linux-shaped filesystem); Windows and macOS run the current version,
  # which is what catches the platform-specific code paths.
  test:
    name: hermetic suite (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      # Lint is an Ubuntu-only gate (PLAT-ci-matrix): one linter, one
      # platform, so a lint finding is never a runner-specific artefact.
      - name: Lint (ruff)
        if: runner.os == 'Linux'
        run: python -m ruff check harness tests audits
      - name: Compile
        run: python -m compileall -q harness tests
      - name: Run tests (hermetic, no network, warnings clean)
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

  audit:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Lint audit script
        run: python -m ruff check audits
      - name: 4-dimensional audit (9.5+ bar on every dimension)
        run: python audits/self/audit.py
      - name: Live model-freshness check (only when OPENROUTER_API_KEY secret is set)
        if: env.OPENROUTER_API_KEY != ''
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m harness.cli capabilities --check-shipped

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          python -m build
      - name: Check metadata (twine)
        run: python -m twine check dist/*
      - name: Version parity (pyproject vs harness.__version__ vs MCP)
        shell: bash
        run: |
          pip install tomli
          python - <<'EOF'
          import subprocess, sys
          try:
              import tomllib
          except ImportError:
              import tomli as tomllib
          from pathlib import Path
          py = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          declared = py["project"]["name"]
          version = py["project"]["version"]
          assert declared == "sovereign-harness", f"unexpected distribution name: {declared}"
          code = "import harness; print(harness.__version__)"
          got = subprocess.run([sys.executable, "-c", code], check=True,
                               capture_output=True, text=True).stdout.strip()
          assert got == version, f"harness.__version__ ({got}) != pyproject ({version})"
          src = Path("harness/mcp.py").read_text(encoding="utf-8")
          assert "from . import __version__" in src, "mcp.py must derive SERVER_VERSION from harness.__version__"
          print(f"version parity OK: {declared} == {version} (importable, reads {got})")
          EOF
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # PLAT-ci-matrix: the *installed* package is what a user runs, and its
  # entry points live in different places per platform (Scripts/ vs bin/).
  # Building once and installing everywhere keeps the matrix honest: the
  # same wheel, three filesystems, three console-script layouts.
  package-installed:
    name: installed package (${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            venv-python: .smoke-venv/bin/python
          - os: windows-latest
            venv-python: .smoke-venv/Scripts/python.exe
          - os: macos-latest
            venv-python: .smoke-venv/bin/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download the built wheel
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Smoke-install the wheel in a clean venv
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .smoke-venv
          PY="${{ matrix.venv-python }}"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install dist/*.whl
          cd "$HOME"  # outside the repo so `import harness` resolves to the wheel
          "$PY" -c "import harness; print(harness.__version__)"
          "$PY" -m harness.cli --help > /dev/null
          "$PY" -m harness.cli gates --json > /dev/null
          echo "installed-package smoke OK on ${{ matrix.os }}"
      - name: Clean up the smoke venv
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/.smoke-venv"
