name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer run for the same ref supersedes queued/running ones -- stops the
# queued-runs pileup seen on the runner-availability crunch of 2026-09-19.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Lint (ruff)
        run: python -m ruff check harness tests
      - name: Compile
        run: python -m compileall -q harness tests
      - name: Run tests (hermetic, no network, warnings clean)
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

  audit:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Lint audit script
        run: python -m ruff check audits
      - name: 4-dimensional audit (9.5+ bar on every dimension)
        run: python audits/self/audit.py
      - name: Live model-freshness check (only when OPENROUTER_API_KEY secret is set)
        if: env.OPENROUTER_API_KEY != ''
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m harness.cli capabilities --check-shipped

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          python -m build
      - name: Check metadata (twine)
        run: python -m twine check dist/*
      - name: Version parity (pyproject vs harness.__version__ vs MCP)
        run: |
          pip install tomli
          python - <<'EOF'
          import subprocess, sys
          try:
              import tomllib
          except ImportError:
              import tomli as tomllib
          from pathlib import Path
          py = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          declared = py["project"]["name"]
          version = py["project"]["version"]
          assert declared == "sovereign-harness", f"unexpected distribution name: {declared}"
          code = "import harness; print(harness.__version__)"
          got = subprocess.run([sys.executable, "-c", code], check=True,
                               capture_output=True, text=True).stdout.strip()
          assert got == version, f"harness.__version__ ({got}) != pyproject ({version})"
          src = Path("harness/mcp.py").read_text(encoding="utf-8")
          assert "from . import __version__" in src, "mcp.py must derive SERVER_VERSION from harness.__version__"
          print(f"version parity OK: {declared} == {version} (importable, reads {got})")
          EOF
      - name: Smoke-install wheel in a clean venv
        run: |
          python -m venv .smoke-venv
          .smoke-venv/bin/python -m pip install --upgrade pip
          .smoke-venv/bin/pip install dist/*.whl
          cd "$HOME"  # outside the repo so `import harness` resolves to the wheel
          "$GITHUB_WORKSPACE/.smoke-venv/bin/python" -c "import harness; print(harness.__version__)"
          "$GITHUB_WORKSPACE/.smoke-venv/bin/harness" --help > /dev/null
      - name: DF-CI-3 -- serve + MCP stdio smoke test (installed wheel, no network)
        run: |
          set -e
          cd "$HOME"  # outside the repo, same as the install-smoke step above
          BIN="$GITHUB_WORKSPACE/.smoke-venv/bin"
          # -- harness serve: bind an OS-assigned free port (--port 0), pull
          # the actual port back out of the startup line it prints on stderr.
          "$BIN/harness" serve --port 0 > serve.out 2> serve.err &
          SERVE_PID=$!
          PORT=""
          for _ in $(seq 1 30); do
            PORT=$(grep -oE 'http://[0-9.]+:[0-9]+/' serve.err | tail -1 | sed -E 's#.*:([0-9]+)/#\1#' || true)
            [ -n "$PORT" ] && break
            sleep 0.5
          done
          if [ -z "$PORT" ]; then
            echo "::error::harness serve never printed its bound port"; cat serve.err; kill "$SERVE_PID" 2>/dev/null || true; exit 1
          fi
          curl -sS -o /dev/null -w '%{http_code}\n' "http://127.0.0.1:$PORT/" | grep -qx 200
          curl -sS -o /dev/null -w '%{http_code}\n' "http://127.0.0.1:$PORT/app.js" | grep -qx 200
          kill "$SERVE_PID" 2>/dev/null || true
          wait "$SERVE_PID" 2>/dev/null || true
          # -- harness-mcp: one JSON-RPC `initialize` frame over stdio. A
          # dummy key is enough: server construction and the handshake
          # response never call out to OpenRouter -- only a chat completion
          # would, and none happens here.
          OPENROUTER_API_KEY=sk-ci-smoke-dummy python3 - "$BIN/harness-mcp" <<'PY'
          import json
          import subprocess
          import sys

          proc = subprocess.Popen(
              [sys.argv[1]], stdin=subprocess.PIPE, stdout=subprocess.PIPE,
              stderr=subprocess.PIPE, text=True, bufsize=1)
          req = {"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {}}
          proc.stdin.write(json.dumps(req) + "\n")
          proc.stdin.flush()
          line = proc.stdout.readline()
          proc.terminate()
          try:
              proc.wait(timeout=5)
          except subprocess.TimeoutExpired:
              proc.kill()
          resp = json.loads(line)
          name = resp["result"]["serverInfo"]["name"]
          assert name == "harness", f"serverInfo.name was {name!r}, expected 'harness'"
          print(f"MCP initialize OK: serverInfo.name == {name!r}")
          PY
          rm -rf "$GITHUB_WORKSPACE/.smoke-venv"
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
